# Scenario A (CLAUDE.md > Scenarios): outbound sales call. The agent speaks first after
# `connected`. System prompt: order.prompt.md. Beat fields: see app/call/scenario.py.
meta:
  brand: Fieldstone Provisions
  agent_name: Ava
  direction: outbound
  customer_id: 1 # Jamie Park
  customer_phone: "+15555550142"

beats:
  - id: c1
    say: "Oh, hi! Yeah, I was looking at those last week but never ended up ordering."

  - id: c2
    wait_for: { agent_said_matches: "link" }
    say: "Sure, text it to me."

  - id: c3
    wait_for: { event: link.sent }
    say: "Got it, it's open. So, I'd like two of the ribeyes."
    heard_as: "Got it, it's open. So, I'd like ten of the ribeyes."

  - id: c4
    # Holds only once the ribeye is in the cart with a quantity other than 2.
    wait_for: { state: "cart.FP-RIBEYE-DA16.qty != 2" }
    say: "Wait, the page says ten. I said two, not ten."
    corrects: c3

  - id: c5
    wait_for: { agent_said_matches: "butter" }
    say: "Oh, that actually looks good. Yeah, add one of those."

  - id: c6
    wait_for: { event: confirm.requested }
    say: "Okay, everything looks right. Confirming now."
    action: confirm

  - id: c7
    optional: true
    say: "Great, thanks Ava. Bye!"
