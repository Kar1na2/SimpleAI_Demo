# Scenario B (CLAUDE.md > Scenarios): inbound call to the restaurant. The agent answers and
# greets first. System prompt: reservation.prompt.md. Beat fields: see app/call/scenario.py.
meta:
  brand: Juniper Table
  agent_name: Leo
  direction: inbound
  customer_id: 2 # Daniel Cho
  customer_phone: "+15555550187"
  # Link page colors: muted teal on cool off-white.
  theme: { accent: "#2C6B6E", surface: "#F4F7F8" }

beats:
  - id: c1
    say: "Hi, I have a reservation and I need to change it. We've got one more person coming."

  - id: c2
    wait_for: { agent_said_matches: "link" }
    say: "Yeah, sure, send it."
    marks: link_accepted

  - id: c3
    wait_for: { state: "reservation.party_size == 5" }
    say: "Okay, I see it. Oh, wait. I didn't realize the fifth is a Saturday. Can we move it a day before, to Friday?"

  - id: c4
    wait_for: { agent_said_matches: "7:30|seven[- ]thirty|19:30" }
    say: "Seven thirty works."

  - id: c5
    # Approved 2026-11-24: answers Leo's "Is there anything else you'd like to change?"
    wait_for:
      agent_said_matches: "anything else"
      state: ["reservation.date == 2026-12-04", "reservation.time == 19:30"]
    say: "No, that's everything."

  - id: c6
    wait_for: { event: confirm.requested }
    say: "Looks right. Confirming."
    action: confirm

  - id: c7
    optional: true
    say: "Thanks, bye."
