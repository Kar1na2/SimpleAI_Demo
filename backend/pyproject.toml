[project]
name = "simpleai-backend"
version = "0.1.0"
description = "SimpleAI demo backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "websockets>=13",
]

[tool.uv]
package = false
