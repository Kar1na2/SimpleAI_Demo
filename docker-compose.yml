services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: simpleai
      POSTGRES_PASSWORD: simpleai
      POSTGRES_DB: simpleai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpleai -d simpleai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
