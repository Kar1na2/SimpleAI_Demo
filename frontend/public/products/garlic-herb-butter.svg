    <circle cx="296" cy="178" r="3"/><circle cx="310" cy="196" r="2.5"/><circle cx="298" cy="214" r="3"/>
    <circle cx="312" cy="226" r="2"/><circle cx="356" cy="222" r="3"/><circle cx="378" cy="216" r="2.5"/>
    <circle cx="386" cy="236" r="3"/><circle cx="362" cy="242" r="2"/><circle cx="252" cy="172" r="2.5"/>
